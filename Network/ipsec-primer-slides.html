<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>IPsec Primer</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --fg: #1d2330; --muted: #5b6475;
    --accent: #2f6fde; --accent2: #0f9d76; --warn: #c2410c; --line: #d9dde5;
    --code: #eef1f6; --deep: #f3f6fc;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f131a; --card: #171c25; --fg: #e6e9ef; --muted: #9aa3b2;
      --accent: #6aa1ff; --accent2: #3ccf9f; --warn: #ff8a50; --line: #2a3140; --code: #1f2633; --deep: #1a2130;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f131a; --card: #171c25; --fg: #e6e9ef; --muted: #9aa3b2;
    --accent: #6aa1ff; --accent2: #3ccf9f; --warn: #ff8a50; --line: #2a3140; --code: #1f2633; --deep: #1a2130;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--fg); font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #root { height: 100%; }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  header .title { font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button { background: var(--card); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; font: inherit; font-size: 14px; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.on { border-color: var(--accent); color: var(--accent); }
  .progress { height: 3px; background: var(--line); }
  .progress > div { height: 100%; background: var(--accent); transition: width .25s; }
  main { flex: 1; overflow: auto; display: flex; justify-content: center; padding: 24px 16px; }
  .slide { width: 100%; max-width: 1000px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 30px 34px; align-self: flex-start; }
  .slide h1 { font-size: 34px; margin: 0 0 8px; }
  .slide h2 { font-size: 26px; margin: 0 0 14px; color: var(--accent); }
  .slide h3 { font-size: 18px; margin: 14px 0 6px; }
  .section { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 4px; }
  .muted { color: var(--muted); }
  ul { padding-left: 22px; } li { margin: 5px 0; }
  table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 15px; }
  th, td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
  th { background: var(--code); }
  code { background: var(--code); padding: 1px 6px; border-radius: 5px; font-size: 14px; }
  pre { background: var(--code); padding: 12px 14px; border-radius: 8px; overflow-x: auto; font-size: 13.5px; line-height: 1.45; margin: 8px 0; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12.5px; font-weight: 600; }
  .good { background: color-mix(in srgb, var(--accent2) 18%, transparent); color: var(--accent2); }
  .bad { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .box { border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; }
  .box h3 { margin: 0 0 6px; }
  .packet { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0; font-size: 13.5px; }
  .packet span { padding: 5px 9px; border-radius: 6px; border: 1px solid var(--line); transition: all .35s; }
  .p-ip { background: color-mix(in srgb, var(--accent) 16%, transparent); }
  .p-esp { background: color-mix(in srgb, var(--warn) 16%, transparent); }
  .p-enc { background: color-mix(in srgb, var(--accent2) 16%, transparent); }
  .p-udp { background: color-mix(in srgb, #a855f7 18%, transparent); }
  .callout { border-left: 4px solid var(--accent); padding: 8px 14px; background: var(--code); border-radius: 0 8px 8px 0; margin: 12px 0; }
  .deep { margin-top: 18px; border: 1px dashed var(--accent); background: var(--deep); border-radius: 12px; padding: 14px 18px; }
  .deep > .section { color: var(--accent); }
  .deeptoggle { margin-top: 16px; }
  .nav { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; border-top: 1px solid var(--line); gap: 8px; }
  .dots { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; }
  .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); cursor: pointer; }
  .dots i.on { background: var(--accent); }
  .dots i.uc { outline: 1px solid var(--accent2); }
  .quiz .q { border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin: 8px 0; cursor: pointer; }
  .quiz .a { color: var(--accent2); margin-top: 6px; }
  svg text { fill: var(--fg); font-size: 13px; }
  svg .lbl { fill: var(--muted); font-size: 12px; }
  .toc { columns: 2; } .toc li { cursor: pointer; } .toc li:hover { color: var(--accent); }
  .flow-ctrl { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 6px 0 10px; }
  .steps { list-style: none; padding: 0; margin: 8px 0 0; counter-reset: s; }
  .steps li { padding: 6px 10px 6px 34px; border-radius: 8px; position: relative; color: var(--muted); cursor: pointer; margin: 2px 0; }
  .steps li::before { counter-increment: s; content: counter(s); position: absolute; left: 8px; top: 6px; width: 19px; height: 19px; border-radius: 50%; background: var(--line); color: var(--fg); font-size: 11.5px; text-align: center; line-height: 19px; }
  .steps li.done { color: var(--fg); }
  .steps li.cur { background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--fg); }
  .steps li.cur::before { background: var(--accent); color: #fff; }
  .steps .d { font-size: 14px; color: var(--muted); }
  .node rect { transition: stroke .3s, fill .3s; }
  .node.hot rect { stroke: var(--accent); stroke-width: 2.5; }
  .node.down rect { stroke: var(--warn); stroke-dasharray: 5 4; }
  .link { transition: opacity .4s, stroke .4s; }
  @media (prefers-reduced-motion: reduce) { .packet span, .progress > div, .link { transition: none; } }
  @media (max-width: 720px) {
    .slide { padding: 18px 16px; } .slide h1 { font-size: 26px; } .slide h2 { font-size: 21px; }
    .grid2 { grid-template-columns: 1fr; } .toc { columns: 1; } body { font-size: 16px; }
    table { font-size: 13.5px; } .slide { overflow-x: auto; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script>
const { useState, useEffect, useCallback, useRef } = React;
const html = htm.bind(React.createElement);
const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};

/* ---------- Animated flow engine ----------
   nodes: { id, x, y, w?, label, sub? }
   links: [fromId, toId, opts?]       (static lines)
   steps: { from, to, label, desc, color?, packet?: [[cls,text],...], hot?: [ids], down?: [ids], dim?: [[a,b]] }
*/
function Flow({ nodes, links, steps, height = 300 }) {
  const [s, setS] = useState(0);
  const [playing, setPlaying] = useState(false);
  const [speed, setSpeed] = useState(1);
  const byId = Object.fromEntries(nodes.map((n) => [n.id, n]));
  const cur = steps[s];
  useEffect(() => {
    if (!playing) return;
    if (s >= steps.length - 1) { setPlaying(false); return; }
    const t = setTimeout(() => setS(s + 1), 2600 / speed);
    return () => clearTimeout(t);
  }, [playing, s, speed, steps.length]);
  const center = (n) => [n.x + (n.w || 130) / 2, n.y + 25];
  const dimmed = (a, b) => (cur.dim || []).some(([x, y]) => (x === a && y === b) || (x === b && y === a));
  let mover = null;
  if (cur.from && cur.to && byId[cur.from] && byId[cur.to]) {
    const [x1, y1] = center(byId[cur.from]); const [x2, y2] = center(byId[cur.to]);
    const path = `M${x1},${y1} L${x2},${y2}`;
    const col = cur.color || "var(--accent)";
    mover = html`<g key=${"m" + s}>
      <path d=${path} stroke=${col} strokeWidth="2.5" fill="none" strokeDasharray="7 5" opacity=".9"/>
      ${reduced
        ? html`<circle cx=${x2} cy=${y2} r="8" fill=${col}/>`
        : html`<circle r="8" fill=${col}><animateMotion dur=${(1.3 / speed) + "s"} fill="freeze" path=${path}/></circle>`}
      <rect x=${(x1 + x2) / 2 - 90} y=${(y1 + y2) / 2 - 30} width="180" height="20" rx="5" fill="var(--card)" opacity=".92"/>
      <text x=${(x1 + x2) / 2} y=${(y1 + y2) / 2 - 15} textAnchor="middle" fontWeight="600">${cur.label}</text>
    </g>`;
  }
  return html`<div>
    <div className="flow-ctrl">
      <button onClick=${() => { setPlaying(false); setS(0); }}>⏮ Reset</button>
      <button onClick=${() => { setPlaying(false); setS(Math.max(0, s - 1)); }} disabled=${s === 0}>◀ Step</button>
      <button className=${playing ? "on" : ""} onClick=${() => { if (s >= steps.length - 1) setS(0); setPlaying(!playing); }}>${playing ? "⏸ Pause" : "▶ Play"}</button>
      <button onClick=${() => { setPlaying(false); setS(Math.min(steps.length - 1, s + 1)); }} disabled=${s === steps.length - 1}>Step ▶</button>
      <button onClick=${() => setSpeed(speed === 1 ? 2 : speed === 2 ? 0.5 : 1)}>Speed ${speed}×</button>
      <span className="muted" style=${{ fontSize: 14 }}>step ${s + 1} / ${steps.length}</span>
    </div>
    <svg viewBox=${"0 0 900 " + height} width="100%" role="img" aria-label="animated flow">
      ${(links || []).map(([a, b, o], i) => { const [x1, y1] = center(byId[a]); const [x2, y2] = center(byId[b]);
        return html`<line key=${"l" + i} className="link" x1=${x1} y1=${y1} x2=${x2} y2=${y2} stroke=${(o && o.color) || "var(--line)"} strokeWidth=${(o && o.w) || 3} opacity=${dimmed(a, b) ? 0.12 : 1} strokeDasharray=${(o && o.dash) || ""}/>`; })}
      ${mover}
      ${nodes.map((n) => html`<g key=${n.id} className=${"node" + ((cur.hot || []).includes(n.id) ? " hot" : "") + ((cur.down || []).includes(n.id) ? " down" : "")}>
        <rect x=${n.x} y=${n.y} width=${n.w || 130} height="50" rx="9" fill="var(--code)" stroke="var(--line)"/>
        <text x=${n.x + (n.w || 130) / 2} y=${n.y + 21} textAnchor="middle" fontWeight="600">${n.label}</text>
        ${n.sub ? html`<text x=${n.x + (n.w || 130) / 2} y=${n.y + 38} textAnchor="middle" className="lbl">${n.sub}</text>` : null}
      </g>`)}
    </svg>
    ${cur.packet ? html`<div className="packet">${cur.packet.map(([c, t], i) => html`<span key=${i} className=${c}>${t}</span>`)}</div>` : null}
    <ol className="steps">${steps.map((st, i) => html`<li key=${i} className=${i === s ? "cur" : i < s ? "done" : ""} onClick=${() => { setPlaying(false); setS(i); }}>
      <b>${st.label}</b>${i === s ? html`<div className="d">${st.desc}</div>` : null}</li>`)}</ol>
  </div>`;
}

/* ---------- Static diagrams ---------- */
function Ikev2Seq() {
  const rows = [
    ["IKE_SA_INIT →", "HDR, SAi1, KEi, Ni, N(NAT_DETECTION_*)", 60, true],
    ["← IKE_SA_INIT", "HDR, SAr1, KEr, Nr, [CERTREQ]", 105, false],
    ["IKE_AUTH →", "HDR, SK{ IDi, AUTH, SAi2, TSi, TSr }", 175, true],
    ["← IKE_AUTH", "HDR, SK{ IDr, AUTH, SAr2, TSi, TSr } ⇒ Child SA up", 220, false],
    ["CREATE_CHILD_SA ↔", "SK{ SA, Ni, [KEi], TSi, TSr } — new / rekey", 285, true],
    ["INFORMATIONAL ↔", "SK{ [N], [D], [CP] } — DPD · delete · notify", 330, true],
  ];
  return html`<svg viewBox="0 0 760 370" width="100%" role="img" aria-label="IKEv2 message sequence">
    <text x="90" y="25" textAnchor="middle" fontWeight="600">Initiator</text>
    <text x="670" y="25" textAnchor="middle" fontWeight="600">Responder</text>
    <line x1="90" y1="35" x2="90" y2="355" stroke="var(--line)" strokeWidth="2"/>
    <line x1="670" y1="35" x2="670" y2="355" stroke="var(--line)" strokeWidth="2"/>
    <rect x="110" y="128" width="540" height="26" rx="6" fill="var(--code)"/>
    <text x="380" y="146" textAnchor="middle" className="lbl">SKEYSEED = prf(Ni|Nr, g^ir) → SK_d, SK_ai/ar, SK_ei/er, SK_pi/pr · SK{} = encrypted</text>
    ${rows.map(([m, d, y, right], i) => html`<g key=${i}>
      <line x1=${right ? 95 : 665} y1=${y} x2=${right ? 660 : 100} y2=${y} stroke="var(--accent)" strokeWidth="2" markerEnd="url(#arr)"/>
      <text x="380" y=${y - 8} textAnchor="middle" fontWeight="600">${m}</text>
      <text x="380" y=${y + 16} textAnchor="middle" className="lbl">${d}</text>
    </g>`)}
    <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker></defs>
  </svg>`;
}

function Quiz() {
  const qs = [
    ["Log says NO_PROPOSAL_CHOSEN on IKE_SA_INIT. What do you compare?", "Both sides' IKE proposals: encryption, PRF/integrity, DH group (and any ke1_ PQC exchange). One full match is enough."],
    ["IKE SA up, Child SA gets TS_UNACCEPTABLE. Why?", "Traffic selectors differ (policy-based) — e.g. 10.1.0.0/16 vs 10.1.1.0/24. Route-based with 0/0 ↔ 0/0 avoids it."],
    ["Ping works, big HTTPS downloads hang. Why?", "MTU/MSS. ESP + NAT-T eats ~60–80 bytes; clamp TCP MSS to ~1360 and set the tunnel MTU."],
    ["AUTHENTICATION_FAILED right after IKE_AUTH. Two suspects?", "PSK mismatch, or the IKE ID (IP vs FQDN) isn't what the peer expects."],
    ["Why both DPD and BGP timers matter for failover?", "DPD detects the dead IKE peer; BGP hold time withdraws routes. Failover time ≈ the faster of the two (or BFD)."],
    ["During a Child SA rekey, why don't packets drop?", "The new SA (new SPIs) is installed before the old one is deleted; both decrypt for a short overlap."],
    ["Why does PQC often need IKE fragmentation?", "ML-KEM-768 public key 1184 B + ciphertext 1088 B make IKE messages big → RFC 7383 fragmentation avoids IP fragment drops."],
    ["Behind a home router, why does the tunnel move to UDP 4500?", "NAT_DETECTION hashes don't match → NAT-T floats IKE to 4500 and wraps ESP in UDP so NAT can track it."],
  ];
  const [open, setOpen] = useState({});
  return html`<div className="quiz">${qs.map(([q, a], i) => html`<div className="q" key=${i} onClick=${() => setOpen({ ...open, [i]: !open[i] })}>
    <strong>${i + 1}. ${q}</strong>${open[i] ? html`<div className="a">${a}</div>` : html`<div className="muted" style=${{ fontSize: 13 }}>click to reveal</div>`}
  </div>`)}</div>`;
}

      <p><b>Fragmentation:</b> 1–1.5 KB key payloads push IKE messages past typical MTUs → enable IKEv2 fragmentation (RFC 7383, <code>fragmentation = yes</code>) so IP fragments aren't dropped by firewalls.</p></div>` },

function App() {
  const [i, setI] = useState(() => Math.min(store.get("ipsec-slide", 0) || 0, slides.length - 1));
  const [deep, setDeep] = useState(() => !!store.get("ipsec-deep", false));
  const [toc, setToc] = useState(false);
  const [theme, setTheme] = useState(null);
  const go = useCallback((n) => { const v = Math.max(0, Math.min(slides.length - 1, n)); setI(v); setToc(false); store.set("ipsec-slide", v); }, []);
  const flipDeep = useCallback(() => setDeep((d) => { store.set("ipsec-deep", !d); return !d; }), []);
  useEffect(() => {
    const k = (e) => {
      if (e.target && e.target.tagName === "BUTTON" && e.key === " ") return;
      if (["ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); go(i + 1); }
      else if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); go(i - 1); }
      else if (e.key === "Home") go(0);
      else if (e.key === "End") go(slides.length - 1);
      else if (e.key === "t" || e.key === "T") setToc((x) => !x);
      else if (e.key === "d" || e.key === "D") flipDeep();
    };
    window.addEventListener("keydown", k); return () => window.removeEventListener("keydown", k);
  }, [i, go, flipDeep]);
  useEffect(() => { if (theme) document.documentElement.setAttribute("data-theme", theme); }, [theme]);
  const dark = theme ? theme === "dark" : window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  const sl = slides[i];
  return html`<div style=${{ height: "100%", display: "flex", flexDirection: "column" }}>
    <header><span className="title">IPsec Primer · ${sl.t}</span>
      <button className=${deep ? "on" : ""} onClick=${flipDeep} title="D">Details ${deep ? "on" : "off"}</button>
      <button onClick=${() => setToc(!toc)}>Contents</button>
      <button onClick=${() => setTheme(dark ? "light" : "dark")}>${dark ? "Light" : "Dark"}</button></header>
    <div className="progress"><div style=${{ width: ((i + 1) / slides.length * 100) + "%" }}></div></div>
    <main>${toc
      ? html`<div className="slide"><h2>Contents</h2><ol className="toc">${slides.map((s, n) => html`<li key=${n} onClick=${() => go(n)}>${s.uc ? "▶ " : ""}${s.t}</li>`)}</ol></div>`
      : html`<div className="slide" key=${i}>${sl.body}
          ${sl.deep ? (deep
            ? html`<div className="deep"><div className="section">Detail layer · examples</div>${sl.deep}</div>`
            : html`<div className="deeptoggle"><button onClick=${flipDeep}>＋ Show details & examples (D)</button></div>`) : null}
        </div>`}</main>
    <div className="nav"><button onClick=${() => go(i - 1)} disabled=${i === 0}>← Prev</button>
      <div className="dots">${slides.map((s, n) => html`<i key=${n} className=${(n === i ? "on " : "") + (s.uc ? "uc" : "")} title=${s.t} onClick=${() => go(n)}></i>`)}</div>
      <span className="muted" style=${{ fontSize: 14 }}>${i + 1} / ${slides.length}</span>
      <button onClick=${() => go(i + 1)} disabled=${i === slides.length - 1}>Next →</button></div>
  </div>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
